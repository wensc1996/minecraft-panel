// MITE-Legend配置文件，说明：【布尔类型：true为是，false为不是】，在【名称=值】之间/之后不要存在空格或者其他无关字符
// 是否开启传送功能
isOpenTp=true

// 反作弊变速检测容忍次数 [范围：1-1000]
cheatSpeedCount=2

// 难度（1是简单，2是普通，3是困难） [范围：1-3]
difficulty=1

// 是否开启直播联动
isOpenWS_V0.34.3=false

// 直播联动端口
WSPort_V0.28.3=8081

// 备份玩家存档间隔时间(单位秒，只限服务端) [范围：1-2147483647]
backupPlayersDelay=600

// 地下世界传送门多少天可以打开(主世界天数) [范围：1-500]
underworldGateOpenDay=1

// 全局怪物实体数量阈值 [范围：100-2000]
maxMobCount=600

// 死亡是否掉落
deathDrop=true

// 玩家周围多少个区块激活 [范围：1-20]
playerActiveChunk=7

// 地狱传送门多少天可以打开(主世界天数) [范围：1-500]
netherGateOpenDay=1

